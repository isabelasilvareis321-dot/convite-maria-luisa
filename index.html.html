<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite 15 Anos - Maria Luísa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #0b1329;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            position: relative;
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            background: #fff;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-size: cover;
            background-position: center;
        }
        .page.active {
            display: block;
        }
        .btn-interativo {
            position: absolute;
            cursor: pointer;
            background: transparent;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Página 1: ENVELOPE (Apenas a porta de entrada inicial) -->
        <div class="page active" id="pagina-1" style="background-image: url('envelope.jpeg');">
            <!-- Ao clicar no envelope, vai direto para a Capa Principal (Página 2) -->
            <div class="btn-interativo" style="top: 40%; left: 30%; width: 40%; height: 25%;" onclick="mudarPagina('pagina-2')"></div>
        </div>

        <!-- Página 2: CAPA / CONVITE PRINCIPAL (A base onde o usuário navega) -->
        <div class="page" id="pagina-2" style="background-image: url('capa.jpeg');">
            <!-- Botão 1: Local do evento (Google Maps em nova aba) -->
            <a href="https://maps.google.com" target="_blank" class="btn-interativo" style="top: 72%; left: 8%; width: 18%; height: 16%;"></a>
            
            <!-- Botão 2: Lista de presentes (Vai para a Página 4 - Presentes) -->
            <div class="btn-interativo" style="top: 72%; left: 30%; width: 18%; height: 16%;" onclick="mudarPagina('pagina-4')"></div>
            
            <!-- Botão 3: Pix como presente (Vai para a Página 3 - Pix) -->
            <div class="btn-interativo" style="top: 72%; left: 52%; width: 18%; height: 16%;" onclick="mudarPagina('pagina-3')"></div>
            
            <!-- Botão 4: Confirmação de presença (Google Forms em nova aba) -->
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSct52eX3xyFmry67RS3C1ldLpFuFWgfYM357_z0ffMEixkyBw/viewform" target="_blank" class="btn-interativo" style="top: 72%; left: 74%; width: 18%; height: 16%;"></a>
        </div>

        <!-- Página 3: PIX (O botão de voltar retorna para a Capa Principal - Página 2) -->
        <div class="page" id="pagina-3" style="background-image: url('pix.jpeg');">
            <div class="btn-interativo" style="top: 88%; left: 10%; width: 25%; height: 7%;" onclick="mudarPagina('pagina-2')"></div>
        </div>

        <!-- Página 4: PRESENTES (O botão de voltar retorna para a Capa Principal - Página 2) -->
        <div class="page" id="pagina-4" style="background-image: url('presente.jpeg');">
            <div class="btn-interativo" style="top: 88%; left: 10%; width: 25%; height: 7%;" onclick="mudarPagina('pagina-2')"></div>
        </div>
    </div>

    <script>
        function mudarPagina(idPaginaDestino) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById(idPaginaDestino).classList.add('active');
        }
    </script>
</body>
</html>
